<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password &mdash; Sentinel Security</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/sentinel.css">
    <link rel="stylesheet" href="/static/css/ui-states.css">
    <style>
        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            margin: 0;
            box-sizing: border-box;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
        }

        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div style="text-align:center;margin-bottom:24px;">
            <div style="width:44px;height:44px;background:var(--text-primary);color:#FFFFFF;border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;">
                <i data-lucide="key" style="width:22px;height:22px;"></i>
            </div>
            <h1 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0 0 4px 0;">Password Recovery</h1>
            <p style="font-size:13px;color:var(--text-secondary);margin:0;">Sentinel Identity Verification</p>
        </div>

        <div class="auth-card">
            <p style="font-size:13px;color:var(--text-secondary);margin-bottom:20px;">
                Enter your registered email address to receive a secure, cryptographic password reset link valid for 24 hours.
            </p>

            {% if error %}
            <div style="padding:10px 14px;background:var(--danger-light);border:1px solid var(--danger-border);border-radius:var(--radius-sm);font-size:12px;color:var(--danger);margin-bottom:16px;display:flex;align-items:center;gap:8px;">
                <i data-lucide="alert-circle" style="width:14px;height:14px;flex-shrink:0;"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('forgot_password') }}" onsubmit="document.getElementById('send-link-btn').disabled=true;">
                <div class="form-group" style="margin-bottom:20px;">
                    <label class="form-label" for="email">Registered Email Address</label>
                    <div style="position:relative;">
                        <input type="email" name="email" id="email" class="form-control" placeholder="name@company.com" required style="padding-left:32px;">
                        <i data-lucide="mail" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);width:14px;height:14px;"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="send-link-btn" style="width:100%;">
                    <i data-lucide="send" style="width:14px;height:14px;"></i>
                    <span>Send Reset Link</span>
                </button>

                <div style="text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-subtle);font-size:12px;">
                    <a href="{{ url_for('login') }}" style="color:var(--accent);text-decoration:none;font-weight:600;">
                        <i data-lucide="arrow-left" style="width:12px;height:12px;display:inline-block;vertical-align:-1px;"></i> Return to Sign In
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/sentinel.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Sentinel.initIcons();
        });
    </script>
</body>
</html>
