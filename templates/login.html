<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FraudShield</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/ui-states.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .bg-animation { display: none; }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-brand .logo {
            width: 60px; height: 60px;
            background: #4f46e5;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            margin-bottom: 20px;
        }

        .login-brand h1 {
            font-size: 26px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .login-brand p {
            color: #94a3b8;
            font-size: 14px;
        }

        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .login-card h2 {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .login-card .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #6366f1;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #6366f1;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #4f46e5;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 12px;
        }

        .login-footer .credentials {
            margin-top: 8px;
            padding: 8px 16px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            border-radius: 6px;
            display: inline-block;
            color: #94a3b8;
        }

        .login-footer .credentials strong {
            color: #818cf8;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <div class="login-container">
        <div class="login-brand">
            <div class="logo"><i class="fas fa-shield-halved"></i></div>
            <h1>FraudShield</h1>
            <p>Credit Card Fraud Detection System</p>
        </div>

        <div class="login-card">
            <h2>Welcome back</h2>
            <p class="subtitle">Sign in to access the fraud detection dashboard</p>

            {% if error %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login" id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" id="username" placeholder="Enter your username" required autofocus autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginSubmitBtn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>

                <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(100, 116, 139, 0.2);">
                    <p style="color: #64748b; font-size: 14px;">
                        Don't have an account? 
                        <a href="{{ url_for('register') }}" style="color: #818cf8; text-decoration: none; font-weight: 600;">Create one now</a>
                    </p>
                </div>
            </form>
        </div>

        <div class="login-footer">
            <p>Protected by FraudShield Security &copy; 2026</p>
            <div class="credentials">
                <strong>Demo Credentials:</strong> admin / admin123
            </div>
        </div>
    </div>

    <script src="/static/js/ui-states.js"></script>
    <script>
        function handleLoginSubmit(e) {
            const btn = document.getElementById('loginSubmitBtn');
            if (window.UIState && btn) {
                UIState.setButtonLoading(btn, true, 'Signing In...');
            }
        }
    </script>
</body>
</html>
