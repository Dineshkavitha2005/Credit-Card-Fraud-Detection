<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account &mdash; Sentinel Security</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/sentinel.css">
    <link rel="stylesheet" href="/static/css/ui-states.css">
    <style>
        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            margin: 0;
            box-sizing: border-box;
        }

        .register-box {
            width: 100%;
            max-width: 520px;
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-brand-logo {
            width: 44px;
            height: 44px;
            background: var(--text-primary);
            color: #FFFFFF;
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-sm);
        }

        .req-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .req-item.met {
            color: var(--success);
        }
    </style>
</head>
<body>
    <div class="register-box">
        <div class="auth-brand">
            <div class="auth-brand-logo">
                <i data-lucide="shield" style="width:22px;height:22px;"></i>
            </div>
            <h1 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0 0 4px 0;">Sentinel Security</h1>
            <p style="font-size:13px;color:var(--text-secondary);margin:0;">Register for Cryptographic Access</p>
        </div>

        <div class="auth-card">
            <h2 style="font-size:16px;font-weight:700;margin-bottom:4px;color:var(--text-primary);">Create User Identity</h2>
            <p style="font-size:12px;color:var(--text-secondary);margin-bottom:20px;">All accounts are provisioned with real-time anomaly alerts</p>

            {% if error %}
            <div style="padding:10px 14px;background:var(--danger-light);border:1px solid var(--danger-border);border-radius:var(--radius-sm);font-size:12px;color:var(--danger);margin-bottom:16px;display:flex;align-items:center;gap:8px;">
                <i data-lucide="alert-circle" style="width:14px;height:14px;flex-shrink:0;"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" id="registerForm" onsubmit="handleRegisterSubmit(event)">
                <div class="grid-2" style="margin-bottom:12px;">
                    <div class="form-group">
                        <label class="form-label">First Name <span style="color:var(--danger);">*</span></label>
                        <input type="text" name="first_name" class="form-control" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Name <span style="color:var(--danger);">*</span></label>
                        <input type="text" name="last_name" class="form-control" placeholder="Doe" required>
                    </div>
                </div>

                <div class="grid-2" style="margin-bottom:12px;">
                    <div class="form-group">
                        <label class="form-label">Email Address <span style="color:var(--danger);">*</span></label>
                        <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" name="phone" class="form-control" placeholder="+1 (555) 000-0000">
                    </div>
                </div>

                <div class="grid-2" style="margin-bottom:12px;">
                    <div class="form-group">
                        <label class="form-label">Username <span style="color:var(--danger);">*</span></label>
                        <input type="text" name="username" class="form-control" placeholder="john_doe" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password <span style="color:var(--danger);">*</span></label>
                        <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required oninput="checkStrength()">
                    </div>
                </div>

                <div style="background:var(--bg-surface-secondary);border:1px solid var(--border-subtle);border-radius:6px;padding:10px 12px;margin-bottom:14px;">
                    <div class="req-item" id="req-len"><i data-lucide="circle" style="width:10px;height:10px;"></i> At least 8 characters</div>
                    <div class="req-item" id="req-upper"><i data-lucide="circle" style="width:10px;height:10px;"></i> One uppercase letter</div>
                    <div class="req-item" id="req-num"><i data-lucide="circle" style="width:10px;height:10px;"></i> One numeric digit</div>
                </div>

                <div class="form-group" style="margin-bottom:14px;">
                    <label class="form-label">Confirm Password <span style="color:var(--danger);">*</span></label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group" style="margin-bottom:12px;">
                    <label class="form-label">Street Address</label>
                    <input type="text" name="address" class="form-control" placeholder="123 Financial Blvd">
                </div>

                <div class="grid-3" style="margin-bottom:16px;">
                    <div class="form-group">
                        <label class="form-label">City</label>
                        <input type="text" name="city" class="form-control" placeholder="New York">
                    </div>
                    <div class="form-group">
                        <label class="form-label">State</label>
                        <input type="text" name="state" class="form-control" placeholder="NY">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Zip Code</label>
                        <input type="text" name="zipcode" class="form-control" placeholder="10001">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom:20px;">
                    <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text-secondary);cursor:pointer;">
                        <input type="checkbox" name="accept_terms" required style="margin-top:2px;">
                        <span>I accept Sentinel Terms of Service, Cryptographic Keys Disclosure, and Security Policies.</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" id="reg-submit-btn" style="width:100%;">
                    <i data-lucide="user-check" style="width:14px;height:14px;"></i>
                    <span>Create Account</span>
                </button>

                <div style="text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-subtle);font-size:12px;color:var(--text-secondary);">
                    Already registered? 
                    <a href="{{ url_for('login') }}" style="color:var(--accent);text-decoration:none;font-weight:600;">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/sentinel.js"></script>
    <script src="/static/js/ui-states.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Sentinel.initIcons();
        });

        function checkStrength() {
            const pwd = document.getElementById('password').value;
            const rLen = document.getElementById('req-len');
            const rUp = document.getElementById('req-upper');
            const rNum = document.getElementById('req-num');

            if (pwd.length >= 8) rLen.classList.add('met'); else rLen.classList.remove('met');
            if (/[A-Z]/.test(pwd)) rUp.classList.add('met'); else rUp.classList.remove('met');
            if (/[0-9]/.test(pwd)) rNum.classList.add('met'); else rNum.classList.remove('met');
        }

        function handleRegisterSubmit(e) {
            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('confirm_password').value;

            if (p1 !== p2) {
                e.preventDefault();
                Sentinel.showToast('Passwords do not match', 'error');
                return false;
            }

            if (p1.length < 8 || !/[A-Z]/.test(p1) || !/[0-9]/.test(p1)) {
                e.preventDefault();
                Sentinel.showToast('Password does not meet requirements', 'error');
                return false;
            }

            const btn = document.getElementById('reg-submit-btn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<span class="btn-spinner"></span> Creating Account...`;
            }
        }
    </script>
</body>
</html>
