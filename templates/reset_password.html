<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password &mdash; Sentinel Security</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/sentinel.css">
    <link rel="stylesheet" href="/static/css/ui-states.css">
    <style>
        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            margin: 0;
            box-sizing: border-box;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-sm);
        }

        .req-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .req-item.met {
            color: var(--success);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div style="text-align:center;margin-bottom:24px;">
            <div style="width:44px;height:44px;background:var(--text-primary);color:#FFFFFF;border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;">
                <i data-lucide="shield-check" style="width:22px;height:22px;"></i>
            </div>
            <h1 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0 0 4px 0;">New Credentials</h1>
            <p style="font-size:13px;color:var(--text-secondary);margin:0;">Establish Strong Encryption Token</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div style="padding:10px 14px;background:var(--danger-light);border:1px solid var(--danger-border);border-radius:var(--radius-sm);font-size:12px;color:var(--danger);margin-bottom:16px;display:flex;align-items:center;gap:8px;">
                <i data-lucide="alert-circle" style="width:14px;height:14px;flex-shrink:0;"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('reset_password', token=token) }}" id="resetForm" onsubmit="handleResetSubmit(event)">
                <div class="form-group" style="margin-bottom:12px;">
                    <label class="form-label" for="password">New Password</label>
                    <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required oninput="checkStrength()">
                </div>

                <div style="background:var(--bg-surface-secondary);border:1px solid var(--border-subtle);border-radius:6px;padding:10px 12px;margin-bottom:14px;">
                    <div class="req-item" id="req-len"><i data-lucide="circle" style="width:10px;height:10px;"></i> At least 8 characters</div>
                    <div class="req-item" id="req-upper"><i data-lucide="circle" style="width:10px;height:10px;"></i> One uppercase letter (A-Z)</div>
                    <div class="req-item" id="req-num"><i data-lucide="circle" style="width:10px;height:10px;"></i> One numeric digit (0-9)</div>
                    <div class="req-item" id="req-spec"><i data-lucide="circle" style="width:10px;height:10px;"></i> One special symbol (!@#$%)</div>
                </div>

                <div class="form-group" style="margin-bottom:20px;">
                    <label class="form-label" for="confirm_password">Confirm New Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" id="reset-btn" style="width:100%;">
                    <i data-lucide="lock" style="width:14px;height:14px;"></i>
                    <span>Confirm Password Reset</span>
                </button>
            </form>
        </div>
    </div>

    <script src="/static/js/sentinel.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Sentinel.initIcons();
        });

        function checkStrength() {
            const pwd = document.getElementById('password').value;
            const rLen = document.getElementById('req-len');
            const rUp = document.getElementById('req-upper');
            const rNum = document.getElementById('req-num');
            const rSpec = document.getElementById('req-spec');

            if (pwd.length >= 8) rLen.classList.add('met'); else rLen.classList.remove('met');
            if (/[A-Z]/.test(pwd)) rUp.classList.add('met'); else rUp.classList.remove('met');
            if (/[0-9]/.test(pwd)) rNum.classList.add('met'); else rNum.classList.remove('met');
            if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pwd)) rSpec.classList.add('met'); else rSpec.classList.remove('met');
        }

        function handleResetSubmit(e) {
            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('confirm_password').value;

            if (p1 !== p2) {
                e.preventDefault();
                Sentinel.showToast('Passwords do not match', 'error');
                return false;
            }

            if (p1.length < 8 || !/[A-Z]/.test(p1) || !/[0-9]/.test(p1)) {
                e.preventDefault();
                Sentinel.showToast('Password does not meet requirements', 'error');
                return false;
            }

            document.getElementById('reset-btn').disabled = true;
        }
    </script>
</body>
</html>
