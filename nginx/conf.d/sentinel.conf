# ==============================================================================
# Sentinel Reverse Proxy Virtual Host Configuration
# TLS Termination, Canonical Redirects, Forwarding Headers & Rate Limiting
# ==============================================================================

upstream sentinel_app {
    server app:5000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# Port 80: HTTP -> HTTPS Permanent Redirection & ACME Challenge
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN.com www.YOUR-DOMAIN.com localhost;

    # Certbot / Let's Encrypt automated challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# Port 443: High-Security HTTPS TLS Termination
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR-DOMAIN.com www.YOUR-DOMAIN.com;

    # SSL Certificate Paths (Let's Encrypt standard location)
    ssl_certificate /etc/letsencrypt/live/YOUR-DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-DOMAIN.com/privkey.pem;

    # Modern TLS Security Parameters (Mozilla Modern Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security Response Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Request Size Limits
    client_max_body_size 16M;

    # Canonical Domain Redirection: enforce non-www canonical URL
    if ($host = 'www.YOUR-DOMAIN.com') {
        return 301 https://YOUR-DOMAIN.com$request_uri;
    }

    # Static Assets Direct Delivery (Optimized Caching & Compression)
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Health Check Endpoint (Unthrottled for Container Probes & Load Balancers)
    location /health {
        proxy_pass http://sentinel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Authentication Endpoints (Dedicated Rate Limiting against Brute Force)
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://sentinel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # General Application Ingress (Gunicorn WSGI)
    location / {
        limit_req zone=general_limit burst=30 nodelay;
        proxy_pass http://sentinel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
