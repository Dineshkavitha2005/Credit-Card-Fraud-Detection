version: '3.8'

services:
  # ============================================================================
  # Credit Card Fraud Detection Web & ML Service
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_detection_app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/fraud_detection.db}
      - SECRET_KEY=${SECRET_KEY}
      - CARD_ENCRYPTION_KEY=${CARD_ENCRYPTION_KEY}
      - WORKERS=${WORKERS:-4}
      - THREADS=${THREADS:-2}
      - TIMEOUT=${TIMEOUT:-120}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - GOOGLE_ALLOWED_DOMAIN=${GOOGLE_ALLOWED_DOMAIN:-}
    volumes:
      # Persist SQLite database across container recreations
      - app_data:/app/data
      # Persist generated PDF & CSV fraud reports
      - reports_data:/app/instance/reports
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # Optional PostgreSQL Database Service (Activated with --profile postgres)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: fraud_detection_postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud_password_secure_2026}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraud_user} -d ${POSTGRES_DB:-fraud_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  app_data:
    name: fraud_detection_app_data
    driver: local
  reports_data:
    name: fraud_detection_reports_data
    driver: local
  db_data:
    name: fraud_detection_db_data
    driver: local
